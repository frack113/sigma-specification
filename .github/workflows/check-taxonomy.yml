---
name: Check the taxonomy
on:
  push:
    branches: [master]
    paths:
      - 'specification/appendix-taxonomy/**'
      - 'specification/sigma-appendix-taxonomy.md'
      - '.github/scripts/check-taxonomy.py'
  pull_request:
    paths:
      - 'specification/appendix-taxonomy/**'
      - 'specification/sigma-appendix-taxonomy.md'
      - '.github/scripts/check-taxonomy.py'
  schedule:
    # first day of every month, the rules repository changes without a pull request here
    - cron: '17 4 1 * *'
permissions:
  contents: read
jobs:
  taxonomy:
    name: Check the log sources against the rules
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Checkout the rules
      uses: actions/checkout@v4
      with:
        repository: SigmaHQ/sigma
        path: sigma-rules
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - run: pip install pyyaml
    - name: Fail when a log source used by a rule has no page
      run: python .github/scripts/check-taxonomy.py sigma-rules